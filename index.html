<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>體育教學觀察系統 (CAFIAS / DAC / CSFI)</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; color: #333; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 20px; font-size: 14px; }
    
    /* Timer Control Card */
    .timer-card { background: #2c3e50; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .timer-info { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .phase-badge { padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 16px; text-transform: uppercase; }
    .phase-observe { background-color: #2ecc71; color: white; }
    .phase-record { background-color: #e67e22; color: white; }
    .phase-idle { background-color: #7f8c8d; color: white; }
    .time-display { font-size: 24px; font-family: monospace; font-weight: bold; }
    .timer-setting-inputs { display: flex; align-items: center; gap: 8px; font-size: 13px; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 5px; }
    .timer-setting-inputs input { width: 50px; padding: 4px; border: 1px solid #ccc; border-radius: 3px; text-align: center; font-weight: bold; }
    .timer-controls { display: flex; gap: 10px; flex-wrap: wrap; }

    /* Nav Tabs */
    .tab-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .tab-button { padding: 10px 20px; font-size: 16px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 5px; transition: 0.3s; }
    .tab-button.active { background: #3498db; color: white; font-weight: bold; }
    
    /* Panels */
    .system-panel { display: none; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .system-panel.active { display: block; }

    .form-group { margin-bottom: 15px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; background: #f9f9f9; padding: 12px; border-radius: 6px; border: 1px solid #eee; }
    .form-group label { font-weight: bold; font-size: 14px; }
    .form-group input, .form-group select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }

    .student-focus-box { background: #e8f4f8; border: 1px solid #3498db; padding: 12px; border-radius: 6px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: center; }
    th { background-color: #f2f2f2; }
    
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .btn-primary { background: #2ecc71; color: white; }
    .btn-undo { background: #e67e22; color: white; font-weight: bold; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-secondary { background: #95a5a6; color: white; }
    .btn-cloud { background: #8e44ad; color: white; font-weight: bold; }
    .btn-pdf { background: #34495e; color: white; font-weight: bold; }
    .btn:hover { opacity: 0.9; }

    .counter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 15px; }
    .counter-card { border: 1px solid #e0e0e0; padding: 12px; border-radius: 6px; text-align: center; background: #fafafa; }
    .counter-card h4 { margin: 5px 0; font-size: 14px; color: #2c3e50; }
    .count-display { font-size: 22px; font-weight: bold; color: #2c3e50; margin: 5px 0; }
    
    .mode-btn-group { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
    .mode-btn { padding: 6px 10px; font-size: 12px; border: 1px solid #3498db; background: white; color: #3498db; cursor: pointer; border-radius: 3px; }
    .mode-btn:hover { background: #3498db; color: white; }

    .record-log { margin-top: 20px; max-height: 150px; overflow-y: auto; background: #f9f9f9; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }

    /* Cloud Sync Status Toast */
    #sync-status { display: none; padding: 10px; margin-top: 10px; border-radius: 4px; text-align: center; font-weight: bold; }
    .sync-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .sync-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .sync-loading { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

    .action-header { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <h1>體育教學電腦觀察系統</h1>
  <div class="subtitle">整合 CAFIAS / DAC / CSFI 時間取樣觀察與 Google Sheet 自動串接功能</div>

  <!-- 計時器與控制欄 -->
  <div class="timer-card">
    <div class="timer-info">
      <div id="phase-badge" class="phase-badge phase-idle">未開始</div>
      <div>
        <div class="time-display" id="timer-display">週期倒數: 10s | 總計: 00:00</div>
        <small id="cycle-count-display">目前週期: #0 (觀察 10s / 記錄 10s)</small>
      </div>
      <div class="timer-setting-inputs">
        <label>觀察秒數:</label>
        <input type="number" id="setting-observe-sec" value="10" min="1" onchange="updateTimerSettings()">
        <label>記錄秒數:</label>
        <input type="number" id="setting-record-sec" value="10" min="1" onchange="updateTimerSettings()">
      </div>
    </div>
    <div class="timer-controls">
      <button class="btn btn-primary" id="start-btn" onclick="toggleTimer()">開始觀察計時</button>
      <button class="btn btn-secondary" onclick="resetTimer()">重置計時器</button>
      <button class="btn btn-undo" onclick="undoLastAction()">↩️ 復原按錯 (Undo)</button>
      <button class="btn btn-pdf" onclick="generatePDFReport()">📄 匯出 PDF 觀察報表</button>
      <button class="btn btn-cloud" onclick="uploadDataToGoogleSheet()">☁️ 同步至 Google 試算表</button>
    </div>
  </div>

  <div id="sync-status"></div>

  <!-- 導覽頁籤 -->
  <div class="tab-container">
    <button class="tab-button active" onclick="switchTab('cafias', event)">CAFIAS 觀察表</button>
    <button class="tab-button" onclick="switchTab('dac', event)">DAC 觀察系統</button>
    <button class="tab-button" onclick="switchTab('csfi', event)">CSFI 對照記錄</button>
  </div>

  <!-- CAFIAS Panel -->
  <div id="cafias" class="system-panel active">
    <h2>CAFIAS 系統觀察量表</h2>
    <div class="form-group">
      <label>觀察教師：</label><input type="text" class="meta-teacher" placeholder="輸入教師姓名" oninput="syncMetaInfo(this)">
      <label>觀察日期：</label><input type="date" class="meta-date" onchange="syncMetaInfo(this)">
      <label>任課班級：</label><input type="text" class="meta-class" placeholder="如：八年二班" oninput="syncMetaInfo(this)">
    </div>

    <div class="counter-grid" id="cafias-counters"></div>

    <div class="action-header">
      <h3>觀察統計結果</h3>
      <button class="btn btn-undo" onclick="undoLastAction()">↩️ 復原按錯 (Undo)</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>行為類別</th>
          <th>型式 (口語 / 非口語 / 同時)</th>
          <th>次數合計</th>
          <th>百分比 (%)</th>
        </tr>
      </thead>
      <tbody id="cafias-summary"></tbody>
    </table>
    <br>
    <button class="btn btn-danger" onclick="resetCafias()">重置數據</button>
  </div>

  <!-- DAC Panel -->
  <div id="dac" class="system-panel">
    <h2>DAC 觀察系統總結記錄表</h2>
    <div class="form-group">
      <label>觀察教師：</label><input type="text" class="meta-teacher" placeholder="輸入教師姓名" oninput="syncMetaInfo(this)">
      <label>觀察日期：</label><input type="date" class="meta-date" onchange="syncMetaInfo(this)">
      <label>任課班級：</label><input type="text" class="meta-class" placeholder="如：八年二班" oninput="syncMetaInfo(this)">
    </div>
    
    <div class="student-focus-box">
      <label for="dac-student-select"><strong>🎯 目前觀察學生代號：</strong></label>
      <select id="dac-student-select" style="font-size: 16px; padding: 5px 10px;"></select>
      <span style="font-size: 13px; color: #555;">(點擊下方行為按鈕時，紀錄將自動歸入此學生代號)</span>
    </div>

    <div class="counter-grid" id="dac-counters"></div>

    <div class="record-log" id="dac-log"><strong>紀錄歷史：</strong><br></div>

    <div class="action-header">
      <h3>DAC 統計矩陣</h3>
      <button class="btn btn-undo" onclick="undoLastAction()">↩️ 復原按錯 (Undo)</button>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr id="dac-header-row"><th>學生代號</th></tr>
        </thead>
        <tbody id="dac-body-rows"></tbody>
      </table>
    </div>
    <br>
    <button class="btn btn-danger" onclick="resetDac()">重置數據</button>
  </div>

  <!-- CSFI Panel -->
  <div id="csfi" class="system-panel">
    <h2>CSFI 觀察紀錄表</h2>
    <div class="form-group">
      <label>觀察教師：</label><input type="text" class="meta-teacher" placeholder="輸入教師姓名" oninput="syncMetaInfo(this)">
      <label>觀察日期：</label><input type="date" class="meta-date" onchange="syncMetaInfo(this)">
      <label>任課班級：</label><input type="text" class="meta-class" placeholder="如：八年二班" oninput="syncMetaInfo(this)">
    </div>

    <div class="counter-grid" id="csfi-counters"></div>

    <div class="action-header">
      <h3>CSFI 行為次數統計</h3>
      <button class="btn btn-undo" onclick="undoLastAction()">↩️ 復原按錯 (Undo)</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>分類</th>
          <th>行為類別及代碼</th>
          <th>型式</th>
          <th>次數</th>
          <th>百分比 (%)</th>
        </tr>
      </thead>
      <tbody id="csfi-summary"></tbody>
    </table>
    <br>
    <button class="btn btn-danger" onclick="resetCsfi()">重置數據</button>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5_MORjdhWNBLCKyLD64sA3KxAOFt3JAzIlYn-9KGHs5hUney1-1PMtZXcV0lJsOCA/exec";

    let actionLog = [];
    let observeDuration = 10;
    let recordDuration = 10;
    
    let timerRunning = false;
    let timerInterval = null;
    let currentPhase = 'idle';
    let phaseTimeLeft = observeDuration;
    let totalSeconds = 0;
    let cycleCount = 0;

    function syncMetaInfo(changedInput) {
      const value = changedInput.value;
      if (changedInput.classList.contains('meta-teacher')) {
        document.querySelectorAll('.meta-teacher').forEach(el => el.value = value);
      } else if (changedInput.classList.contains('meta-date')) {
        document.querySelectorAll('.meta-date').forEach(el => el.value = value);
      } else if (changedInput.classList.contains('meta-class')) {
        document.querySelectorAll('.meta-class').forEach(el => el.value = value);
      }
    }

    function updateTimerSettings() {
      const obsVal = parseInt(document.getElementById('setting-observe-sec').value, 10);
      const recVal = parseInt(document.getElementById('setting-record-sec').value, 10);
      
      observeDuration = obsVal > 0 ? obsVal : 10;
      recordDuration = recVal > 0 ? recVal : 10;

      if (!timerRunning && currentPhase === 'idle') {
        phaseTimeLeft = observeDuration;
      }
      updateTimerUI();
    }

    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.system-panel').forEach(panel => panel.classList.remove('active'));
      
      if (evt && evt.currentTarget) {
        evt.currentTarget.classList.add('active');
      } else {
        const btnIndex = tabId === 'cafias' ? 0 : (tabId === 'dac' ? 1 : 2);
        document.querySelectorAll('.tab-button')[btnIndex].classList.add('active');
      }
      document.getElementById(tabId).classList.add('active');
    }

    function toggleTimer() {
      if (!timerRunning) {
        startTimer();
      } else {
        pauseTimer();
      }
    }

    function startTimer() {
      timerRunning = true;
      document.getElementById('start-btn').innerText = "暫停計時";
      if (currentPhase === 'idle') {
        currentPhase = 'observe';
        phaseTimeLeft = observeDuration;
        cycleCount = 1;
      }
      updateTimerUI();

      timerInterval = setInterval(() => {
        totalSeconds++;
        phaseTimeLeft--;

        if (phaseTimeLeft <= 0) {
          if (currentPhase === 'observe') {
            currentPhase = 'record';
            phaseTimeLeft = recordDuration;
            playBeep(800, 0.2);
          } else {
            currentPhase = 'observe';
            phaseTimeLeft = observeDuration;
            cycleCount++;
            playBeep(1200, 0.2);
          }
        }
        updateTimerUI();
      }, 1000);
    }

    function pauseTimer() {
      timerRunning = false;
      clearInterval(timerInterval);
      document.getElementById('start-btn').innerText = "繼續計時";
    }

    function resetTimer() {
      pauseTimer();
      currentPhase = 'idle';
      phaseTimeLeft = observeDuration;
      totalSeconds = 0;
      cycleCount = 0;
      document.getElementById('start-btn').innerText = "開始觀察計時";
      updateTimerUI();
    }

    function updateTimerUI() {
      const badge = document.getElementById('phase-badge');
      if (currentPhase === 'observe') {
        badge.innerText = "觀察中 (Observe)";
        badge.className = "phase-badge phase-observe";
      } else if (currentPhase === 'record') {
        badge.innerText = "記錄中 (Record)";
        badge.className = "phase-badge phase-record";
      } else {
        badge.innerText = "未開始";
        badge.className = "phase-badge phase-idle";
      }

      const totalMins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const totalSecs = String(totalSeconds % 60).padStart(2, '0');
      document.getElementById('timer-display').innerText = `週期倒數: ${phaseTimeLeft}s | 總計: ${totalMins}:${totalSecs}`;
      document.getElementById('cycle-count-display').innerText = `目前週期: #${cycleCount} (觀察 ${observeDuration}s / 記錄 ${recordDuration}s)`;
    }

    function playBeep(freq, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        osc.frequency.value = freq;
        osc.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    // --- CAFIAS ---
    const cafiasCategories = [
      { id: 1, name: "稱讚鼓勵" },
      { id: 2, name: "接納採用學生觀點" },
      { id: 3, name: "問問題" },
      { id: 4, name: "給予訊息" },
      { id: 5, name: "指示命令" },
      { id: 6, name: "批評或辯護權威" },
      { id: 7, name: "可預期的反應" },
      { id: 8, name: "理解性的反應" },
      { id: 9, name: "主動行為" },
      { id: 10, name: "安靜或混淆" }
    ];

    let cafiasData = {};
    cafiasCategories.forEach(c => { cafiasData[c.id] = { verbal: 0, nonVerbal: 0, simultaneous: 0 }; });

    function initCafias() {
      const container = document.getElementById('cafias-counters');
      container.innerHTML = '';
      cafiasCategories.forEach(c => {
        const card = document.createElement('div');
        card.className = 'counter-card';
        card.innerHTML = `
          <h4>${c.id}. ${c.name}</h4>
          <div class="count-display" id="cafias-total-${c.id}">0</div>
          <div class="mode-btn-group">
            <button class="mode-btn" onclick="addCafias(${c.id}, 'verbal')">口語</button>
            <button class="mode-btn" onclick="addCafias(${c.id}, 'nonVerbal')">非口語</button>
            <button class="mode-btn" onclick="addCafias(${c.id}, 'simultaneous')">同時</button>
          </div>
        `;
        container.appendChild(card);
      });
      updateCafiasTable();
    }

    function addCafias(id, type) {
      cafiasData[id][type]++;
      const typeText = type === 'verbal' ? '口語' : (type === 'nonVerbal' ? '非口語' : '同時');
      const catName = cafiasCategories.find(c => c.id === id).name;
      logAction('CAFIAS', `${id}.${catName} (${typeText})`, { targetSystem: 'CAFIAS', id: id, type: type });
      updateCafiasTable();
    }

    function updateCafiasTable() {
      let totalAll = 0;
      cafiasCategories.forEach(c => {
        totalAll += cafiasData[c.id].verbal + cafiasData[c.id].nonVerbal + cafiasData[c.id].simultaneous;
        document.getElementById(`cafias-total-${c.id}`).innerText = 
          cafiasData[c.id].verbal + cafiasData[c.id].nonVerbal + cafiasData[c.id].simultaneous;
      });

      const tbody = document.getElementById('cafias-summary');
      tbody.innerHTML = '';
      cafiasCategories.forEach(c => {
        const total = cafiasData[c.id].verbal + cafiasData[c.id].nonVerbal + cafiasData[c.id].simultaneous;
        const pct = totalAll > 0 ? ((total / totalAll) * 100).toFixed(1) : 0;
        tbody.innerHTML += `
          <tr>
            <td>${c.id}. ${c.name}</td>
            <td>口語: ${cafiasData[c.id].verbal} | 非口語: ${cafiasData[c.id].nonVerbal} | 同時: ${cafiasData[c.id].simultaneous}</td>
            <td>${total}</td>
            <td>${pct}%</td>
          </tr>
        `;
      });
    }

    function resetCafias() {
      cafiasCategories.forEach(c => { cafiasData[c.id] = { verbal: 0, nonVerbal: 0, simultaneous: 0 }; });
      updateCafiasTable();
    }

    // --- DAC 觀察系統 ---
    const dacCategories = [
      { name: "獎勵", verbalCode: 2, nonVerbalCode: 12 },
      { name: "接納", verbalCode: 3, nonVerbalCode: 13 },
      { name: "提問", verbalCode: 4, nonVerbalCode: 14 },
      { name: "提供訊息", verbalCode: 5, nonVerbalCode: 15 },
      { name: "提供指示", verbalCode: 6, nonVerbalCode: 16 },
      { name: "評論", verbalCode: 7, nonVerbalCode: 17 },
      { name: "可以預期的學生反應", verbalCode: 8, nonVerbalCode: 18 },
      { name: "學生的解釋性行為", verbalCode: "8'", nonVerbalCode: "18'" },
      { name: "學生的潛意識行為", verbalCode: 9, nonVerbalCode: 19 },
      { name: "紊亂", singleCode: 10 },
      { name: "安靜", singleCode: 20 }
    ];

    const dacCodes = [2, 12, 3, 13, 4, 14, 5, 15, 6, 16, 7, 17, 8, 18, "8'", "18'", 9, 19, 10, 20];
    const students = Array.from({length: 10}, (_, i) => i + 1);
    let dacMatrix = {};

    function initDac() {
      const stuSelect = document.getElementById('dac-student-select');
      stuSelect.innerHTML = '';
      students.forEach(s => stuSelect.innerHTML += `<option value="${s}">學生 ${s}</option>`);

      students.forEach(s => {
        dacMatrix[s] = {};
        dacCodes.forEach(c => dacMatrix[s][c] = 0);
      });

      const container = document.getElementById('dac-counters');
      container.innerHTML = '';
      dacCategories.forEach(cat => {
        const card = document.createElement('div');
        card.className = 'counter-card';
        
        if (cat.singleCode) {
          card.innerHTML = `
            <h4>${cat.name}</h4>
            <div class="mode-btn-group" style="margin-top: 15px;">
              <button class="mode-btn" onclick="addDacByCode('${cat.singleCode}', '${cat.name}')">記錄 (${cat.singleCode})</button>
            </div>
          `;
        } else {
          card.innerHTML = `
            <h4>${cat.name}</h4>
            <div class="mode-btn-group" style="margin-top: 10px;">
              <button class="mode-btn" onclick="addDacByCode('${cat.verbalCode}', '${cat.name}-口語')">口語 (${cat.verbalCode})</button>
              <button class="mode-btn" onclick="addDacByCode('${cat.nonVerbalCode}', '${cat.name}-非口語')">非口語 (${cat.nonVerbalCode})</button>
            </div>
          `;
        }
        container.appendChild(card);
      });

      renderDacMatrix();
    }

    function addDacByCode(code, label) {
      const student = document.getElementById('dac-student-select').value;
      dacMatrix[student][code]++;
      
      const desc = `學生 ${student}: ${label} (代碼 ${code})`;
      logAction('DAC', desc, { targetSystem: 'DAC', student: student, code: code });

      renderDacLogUI();
      renderDacMatrix();
    }

    function renderDacLogUI() {
      const log = document.getElementById('dac-log');
      log.innerHTML = '<strong>紀錄歷史：</strong><br>';
      actionLog.filter(item => item.system === 'DAC').forEach(item => {
        log.innerHTML += `[${item.timestamp}] ${item.description}<br>`;
      });
      log.scrollTop = log.scrollHeight;
    }

    function renderDacMatrix() {
      const headerRow = document.getElementById('dac-header-row');
      headerRow.innerHTML = '<th>學生代號</th>';
      dacCodes.forEach(c => headerRow.innerHTML += `<th>${c}</th>`);
      headerRow.innerHTML += '<th>總數</th><th>百分比 (%)</th>';

      const bodyRows = document.getElementById('dac-body-rows');
      bodyRows.innerHTML = '';

      let grandTotal = 0;
      let colTotals = {};
      dacCodes.forEach(c => colTotals[c] = 0);

      students.forEach(s => {
        let rowTotal = 0;
        dacCodes.forEach(c => rowTotal += dacMatrix[s][c]);
        grandTotal += rowTotal;
      });

      students.forEach(s => {
        let rowTotal = 0;
        let rowHTML = `<tr><td>${s}</td>`;
        dacCodes.forEach(c => {
          const count = dacMatrix[s][c];
          rowTotal += count;
          colTotals[c] += count;
          rowHTML += `<td>${count || ''}</td>`;
        });
        const pct = grandTotal > 0 ? ((rowTotal / grandTotal) * 100).toFixed(1) : 0;
        rowHTML += `<td><strong>${rowTotal}</strong></td><td>${pct}%</td></tr>`;
        bodyRows.innerHTML += rowHTML;
      });

      let totalRowHTML = '<tr><td><strong>總數</strong></td>';
      dacCodes.forEach(c => totalRowHTML += `<td><strong>${colTotals[c]}</strong></td>`);
      totalRowHTML += `<td><strong>${grandTotal}</strong></td><td>100%</td></tr>`;
      bodyRows.innerHTML += totalRowHTML;
    }

    function resetDac() {
      students.forEach(s => { dacCodes.forEach(c => dacMatrix[s][c] = 0); });
      actionLog = actionLog.filter(item => item.system !== 'DAC');
      renderDacLogUI();
      renderDacMatrix();
    }

    // --- CSFI ---
    const csfiCategories = [
      { cat: "教師行為", name: "讚美 (2+12)", id: "csfi_2_12" },
      { cat: "教師行為", name: "接納 (3+13)", id: "csfi_3_13" },
      { cat: "教師行為", name: "發問 (4+14)", id: "csfi_4_14" },
      { cat: "教師行為", name: "講課 (5+15)", id: "csfi_5_15" },
      { cat: "教師行為", name: "給予指導 (6+16)", id: "csfi_6_16" },
      { cat: "教師行為", name: "批評 (7+17)", id: "csfi_7_17" },
      { cat: "學生行為", name: "可預期的反應 (8+18)", id: "csfi_8_18" },
      { cat: "學生行為", name: "學生之間可預期的反應 (88)", id: "csfi_88" },
      { cat: "學生行為", name: "理解性的行為 (8+18)", id: "csfi_8_18_alt" },
      { cat: "學生行為", name: "學生之間理解性的行為 (89)", id: "csfi_89" },
      { cat: "學生行為", name: "主動的行為 (9+19)", id: "csfi_9_19" },
      { cat: "學生行為", name: "學生之間主動的行為 (99)", id: "csfi_99" },
      { cat: "其他", name: "混亂或安靜 (10/20)", id: "csfi_10_20" }
    ];

    let csfiData = {};
    csfiCategories.forEach(item => { csfiData[item.id] = { verbal: 0, nonVerbal: 0 }; });

    function initCsfi() {
      const container = document.getElementById('csfi-counters');
      container.innerHTML = '';
      csfiCategories.forEach(item => {
        const card = document.createElement('div');
        card.className = 'counter-card';
        card.innerHTML = `
          <h4>${item.name}</h4>
          <div class="count-display" id="total-${item.id}">0</div>
          <div class="mode-btn-group">
            <button class="mode-btn" onclick="addCsfi('${item.id}', 'verbal')">口語</button>
            <button class="mode-btn" onclick="addCsfi('${item.id}', 'nonVerbal')">非口語</button>
          </div>
        `;
        container.appendChild(card);
      });
      updateCsfiTable();
    }

    function addCsfi(id, type) {
      csfiData[id][type]++;
      const typeText = type === 'verbal' ? '口語' : '非口語';
      const itemName = csfiCategories.find(item => item.id === id).name;
      logAction('CSFI', `${itemName} (${typeText})`, { targetSystem: 'CSFI', id: id, type: type });
      updateCsfiTable();
    }

    function updateCsfiTable() {
      let grandTotal = 0;
      csfiCategories.forEach(item => {
        grandTotal += csfiData[item.id].verbal + csfiData[item.id].nonVerbal;
        document.getElementById(`total-${item.id}`).innerText = csfiData[item.id].verbal + csfiData[item.id].nonVerbal;
      });

      const tbody = document.getElementById('csfi-summary');
      tbody.innerHTML = '';
      csfiCategories.forEach(item => {
        const total = csfiData[item.id].verbal + csfiData[item.id].nonVerbal;
        const pct = grandTotal > 0 ? ((total / grandTotal) * 100).toFixed(1) : 0;
        tbody.innerHTML += `
          <tr>
            <td>${item.cat}</td>
            <td>${item.name}</td>
            <td>口語: ${csfiData[item.id].verbal} | 非口語: ${csfiData[item.id].nonVerbal}</td>
            <td>${total}</td>
            <td>${pct}%</td>
          </tr>
        `;
      });
    }

    function resetCsfi() {
      csfiCategories.forEach(item => { csfiData[item.id] = { verbal: 0, nonVerbal: 0 }; });
      updateCsfiTable();
    }

    // 紀錄動作 Log
    function logAction(systemName, description, metaDetail) {
      actionLog.push({
        cycle: cycleCount,
        phase: currentPhase === 'observe' ? '觀察中' : (currentPhase === 'record' ? '記錄中' : '未啟動'),
        system: systemName,
        description: description,
        metaDetail: metaDetail,
        timestamp: new Date().toLocaleTimeString()
      });
    }

    // ↩️ 復原按錯功能 (Undo Function)
    function undoLastAction() {
      if (actionLog.length === 0) {
        alert("目前沒有可以復原的紀錄！");
        return;
      }

      const lastItem = actionLog.pop(); // 彈出最後一筆紀錄
      const meta = lastItem.metaDetail;

      if (meta) {
        if (meta.targetSystem === 'CAFIAS') {
          if (cafiasData[meta.id] && cafiasData[meta.id][meta.type] > 0) {
            cafiasData[meta.id][meta.type]--;
            updateCafiasTable();
          }
        } else if (meta.targetSystem === 'DAC') {
          if (dacMatrix[meta.student] && dacMatrix[meta.student][meta.code] > 0) {
            dacMatrix[meta.student][meta.code]--;
            renderDacLogUI();
            renderDacMatrix();
          }
        } else if (meta.targetSystem === 'CSFI') {
          if (csfiData[meta.id] && csfiData[meta.id][meta.type] > 0) {
            csfiData[meta.id][meta.type]--;
            updateCsfiTable();
          }
        }
      }

      const statusDiv = document.getElementById('sync-status');
      statusDiv.style.display = 'block';
      statusDiv.className = 'sync-success';
      statusDiv.innerText = `↩️ 已成功復原：${lastItem.system} - ${lastItem.description}`;
      setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);
    }

    // 生成 PDF 報表功能
    function generatePDFReport() {
      const teacherVal = document.querySelector('.meta-teacher').value || '未填寫';
      const dateVal = document.querySelector('.meta-date').value || new Date().toISOString().split('T')[0];
      const classVal = document.querySelector('.meta-class').value || '未填寫';

      const opt = {
        margin:       10,
        filename:     `體育教學觀察總報表_${teacherVal}_${dateVal}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
      };

      const reportContainer = document.createElement('div');
      reportContainer.style.padding = '10px';
      reportContainer.innerHTML = `
        <h1 style="text-align:center;">體育教學觀察系統 - 綜合觀察分析報表</h1>
        <p style="text-align:center; color:#555;">觀察教師：<b>${teacherVal}</b> | 觀察日期：<b>${dateVal}</b> | 任課班級：<b>${classVal}</b></p>
        <hr>
        <h3>一、 CAFIAS 觀察統計結果</h3>
        ${document.querySelector('#cafias table').outerHTML}
        <br><br>
        <h3>二、 DAC 互動分析矩陣</h3>
        ${document.querySelector('#dac table').outerHTML}
        <br><br>
        <h3>三、 CSFI 行為次數統計表</h3>
        ${document.querySelector('#csfi table').outerHTML}
      `;

      html2pdf().set(opt).from(reportContainer).save();
    }

    function uploadDataToGoogleSheet() {
      const statusDiv = document.getElementById('sync-status');
      statusDiv.style.display = 'block';
      statusDiv.className = 'sync-loading';
      statusDiv.innerText = '⏳ 正在將觀察數據同步至 Google 試算表...';

      const teacherVal = document.querySelector('.meta-teacher').value || "未指定";
      const dateVal = document.querySelector('.meta-date').value || new Date().toISOString().split('T')[0];
      const classVal = document.querySelector('.meta-class').value || "未指定";

      const payload = {
        meta: {
          teacher: teacherVal,
          date: dateVal,
          className: classVal
        },
        actionStack: actionLog
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.className = 'sync-success';
        statusDiv.innerText = '✅ 資料已成功送出至 Google 試算表！';
        setTimeout(() => { statusDiv.style.display = 'none'; }, 4000);
      })
      .catch(error => {
        statusDiv.className = 'sync-error';
        statusDiv.innerText = '❌ 同步失敗，請檢查網路連線：' + error;
      });
    }

    // 全域鍵盤快捷鍵觸發 (Ctrl+Z 或 Cmd+Z)
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undoLastAction();
      }
    });

    window.onload = function() {
      const todayStr = new Date().toISOString().split('T')[0];
      document.querySelectorAll('.meta-date').forEach(el => el.value = todayStr);
      initCafias();
      initDac();
      initCsfi();
    };
  </script>
</body>
</html>
